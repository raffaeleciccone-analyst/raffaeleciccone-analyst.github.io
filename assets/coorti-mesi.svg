<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="t d"><title id="t">Retention per mese del calendario</title><desc id="d">Percentuale media di clienti che tornano a comprare, per mese del calendario: massimo a novembre (25,0%), minimo a gennaio e febbraio (11,3% e 12,0%).</desc><rect width="720" height="450" fill="#FFFFFF"/><text x="24.0" y="34.0" font-family="Archivo,system-ui,sans-serif" font-size="20" font-weight="700" fill="#15191B" text-anchor="start">Quanti clienti tornano, per mese del calendario</text><text x="24.0" y="60.0" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="start">Media su tutte le coorti di un e-commerce UK, 2010-2011</text><line x1="40" y1="388" x2="696" y2="388" stroke="#15191B" stroke-width="1"/><rect x="48.7" y="270.1" width="37.2" height="117.9" fill="#C3C8C9"/><text x="67.3" y="263.1" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#15191B" text-anchor="middle">11,3</text><text x="67.3" y="408.0" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="middle">gen</text><rect x="103.4" y="262.7" width="37.2" height="125.3" fill="#828C8E"/><text x="122.0" y="255.7" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="700" fill="#15191B" text-anchor="middle">12,0</text><text x="122.0" y="408.0" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="middle">feb</text><rect x="158.1" y="222.5" width="37.2" height="165.5" fill="#C3C8C9"/><text x="176.7" y="215.5" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#15191B" text-anchor="middle">15,9</text><text x="176.7" y="408.0" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="middle">mar</text><rect x="212.7" y="227.7" width="37.2" height="1