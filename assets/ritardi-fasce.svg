<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="t d"><title id="t">Recensioni negative per fascia di consegna, Olist</title><desc id="d">Recensioni negative per fascia di anticipo o ritardo della consegna su 95.824 ordini recensiti: 8,9%, 9,6% e 11,3% in orario; 32,2%, 67,6%, 80,0%, 82,1% e 67,8% in ritardo, quasi tutte scritte prima di ricevere il pacco.</desc><rect width="720" height="450" fill="#FFFFFF"/><text x="24.0" y="34.0" font-family="Archivo,system-ui,sans-serif" font-size="20" font-weight="700" fill="#15191B" text-anchor="start">Recensioni negative per fascia di consegna</text><text x="24.0" y="60.0" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="start">Sugli ordini in ritardo quasi tutte arrivano prima che il cliente abbia il pacco</text><rect x="24" y="420" width="12" height="12" fill="#C3C8C9"/><text x="42.0" y="430.0" font-family="Archivo,system-ui,sans-serif" font-size="13" font-weight="400" fill="#4E5658" text-anchor="start">in orario</text><rect x="122.8" y="420" width="12" height="12" fill="#8DB3B6"/><text x="140.8" y="430.0" font-family="Archivo,system-ui,sans-serif" font-size="13" font-weight="400" fill="#4E5658" text-anchor="start">in ritardo, col pacco</text><rect x="308.0" y="420" width="12" height="12" fill="#16565C"/><text x="326.0" y="430.0" font-family="Archivo,system-ui,sans-serif" font-size="13" font-weight="400" fill="#4E5658" text-anchor="start">in ritardo, prima del pacco</text><text x="160.0" y="110.7" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="end">10+ gg in anticipo</text><rect x="172" y="92" width="43.3" height="26" fill="#C3C8C9"/><text x="223.3" y="110.7" font-family="Archivo,system-ui,sans-serif" font-size="15" font-weight="600" fill="#15191B" text-anchor="start">8,9%</text><text x="160.0" y="151.7" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="end">5-9 gg in anticipo</text><rect x="172" y="133" width="46.6" height="26" fill="#C3C8C9"/><text x="226.6" y="151.7" font-family="Archivo,system-ui,sans-serif" font-size="15" font-weight="600" fill="#15191B" text-anchor="start">9,6%</text><text x="160.0" y="192.7" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="end">0-4 gg in anticipo</text><rect x="172" y="174" width="54.9" height="26" fill="#C3C8C9"/><text x="234.9" y="192.7" font-family="Archivo,system-ui,sans-serif" font-size="15" font-weight="600" fill="#15191B" text-anchor="start">11,3%</text><text x="160.0" y="233.7" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="end">1-3 gg di ritardo</text><rect x="172" y="215" width="70.6" height="26" fill="#8DB3B6"/><rect x="243.6" y="215" width="86.0" height="26" fill="#16565C"/><text x="337.7" y="233.7" font-family="Archivo,system-ui,sans-serif" font-size="15" font-weight="600" fill="#15191B" text-anchor="start">32,2%</text><text x="160.0" y="274.7" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="end">4-7 gg di ritardo</text><rect x="172" y="256" width="22.4" height="26" fill="#8DB3B6"/><rect x="195.4" y="256" width="307.6" height="26" fill="#16565C"/><text x="511.1" y="274.7" font-family="Archivo,system-ui,sans-serif" font-size="15" font-weight="600" fill="#15191B" text-anchor="start">67,6%</text><text x="160.0" y="315.7" font-family="Archivo,system-ui,sans-serif" font-size="14" font-weight="400" fill="#4E5658" text-anchor="end">8-15 gg di ritardo</text><rect x="172" y="297" width="4.6" height="26" fill="#8DB3B6"/><rect x="177.6" y="297" width="386.2" height="26" fill="#16565C"/><text x="571.8" y="315.7" font-family="Archivo,system-ui,sans-serif" font-size="15" font-weight="600" fill="#15191B" text-anchor="start">80,0%</text><text x="160.0" y="